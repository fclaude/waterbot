# GitLab CI/CD Pipeline for WaterBot

image: python:3.11-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  OPERATION_MODE: "emulation"

cache:
  paths:
    - .cache/pip
    - .venv/

stages:
  - quality
  - test

before_script:
  - apt-get update -qq && apt-get install -y -qq git make gcc build-essential
  - python --version
  - pip install --upgrade pip
  - python -m venv .venv
  - source .venv/bin/activate
  - pip install -r requirements-dev.txt

code-quality:
  stage: quality
  script:
    - make format-check
    - make lint
    - make type-check
    - make security-check
  only:
    - main
    - merge_requests

test-unit:
  stage: test
  script:
    - make test-cov
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths:
      - htmlcov/
    expire_in: 30 days
  only:
    - main
    - merge_requests

test-python-versions:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12"]
  image: python:${PYTHON_VERSION}-slim
  script:
    - make test
  only:
    - main
    - merge_requests

mr-check:
  stage: quality
  script:
    - make format-check
    - make lint
    - make type-check
    - make test-cov-fail
  only:
    - merge_requests
  except:
    - main
